<!doctype html>
<!-- Static layout reference (illustrative figures only — not real bank data).
     Interactive mock script omitted; live UI is implemented in Next.js components. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZYFN — Dashboard preview (reference)</title>
<style>
:root {
  --navy: #263d5b;
  --slate: #a4b1c0;
  --ink: #233044;
  --muted: #657185;
  --line: #cbd2dc;
  --bg: #f1f3f5;
  --green: #276b54;
  --control-height: 36px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 Arial, "Helvetica Neue", sans-serif; }
.shell { display: flex; min-width: 1100px; min-height: 100vh; }
.sidebar { width: 224px; flex-shrink: 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; background: #1e2c40; color: #fff; border-right: 1px solid #152235; }
.brand { min-height: 64px; display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid #38465a; font-size: 22px; font-weight: 600; letter-spacing: 2px; }
.nav { flex: 1; overflow-y: auto; padding: 16px 12px; }
.nav-item { display: flex; align-items: center; min-height: 38px; margin: 0 0 3px; padding: 8px 14px; border-radius: 3px; color: #c1cad7; font-size: 14px; text-decoration: none; }
.nav-item.active { background: #33465f; color: #fff; font-weight: 600; }
.side-foot { flex-shrink: 0; padding: 12px 24px; border-top: 1px solid #38465a; font-size: 12px; color: #aeb8c6; }
.workspace { flex: 1; min-width: 0; display: flex; flex-direction: column; min-height: 100vh; }
.topbar { min-height: 64px; background: #fff; border-bottom: 1px solid var(--line); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; }
.topbar h1 { font-size: 20px; font-weight: 600; margin: 0; }
.topbar p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
.content { flex: 1; max-width: 1560px; margin: 0 auto; padding: 24px 32px; width: 100%; }
.toolbar h2 { font-size: 17px; font-weight: 600; margin: 0; }
.toolbar p { font-size: 13px; color: var(--muted); margin: 3px 0 0; }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.kpi { padding: 19px 21px; border-top: 3px solid var(--navy); }
.kpi-label { color: #526075; font-size: 14px; font-weight: 600; }
.kpi-amount { font-size: 30px; margin: 10px 0; font-variant-numeric: tabular-nums; }
.middle { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(330px, 1fr); gap: 18px; margin-top: 20px; }
.card-head { padding: 16px 20px; border-bottom: 1px solid var(--line); background: #fafbfc; }
.footer { border-top: 1px solid var(--line); background: #fff; padding: 12px 32px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand">ZYFN</div><nav class="nav"></nav><div class="side-foot">Illustrative layout reference</div></aside>
<div class="workspace">
<header class="topbar"><div><h1>Dashboard</h1><p>Personal financial overview</p></div></header>
<main class="content">
<div class="toolbar"><div><h2>Monthly summary</h2><p>Placeholder period note</p></div></div>
<section class="kpis">
<article class="card kpi"><div class="kpi-label">Monthly spending</div><div class="kpi-amount">—</div></article>
<article class="card kpi"><div class="kpi-label">Available balance</div><div class="kpi-amount">—</div></article>
<article class="card kpi"><div class="kpi-label">Fixed deposits</div><div class="kpi-amount">—</div></article>
</section>
<div class="middle">
<section class="card"><div class="card-head"><h3>Monthly cash flow</h3></div></section>
<section class="card"><div class="card-head"><h3>Account balances</h3></div></section>
</div>
</main>
<footer class="footer"><span>ZYFN · Personal finance</span><span>Illustrative figures · MYR</span></footer>
</div>
</div>
</body>
</html>
